<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sealShade" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8E0D16" />
      <stop offset="75%" stop-color="#790B13" />
      <stop offset="100%" stop-color="#5E080F" />
    </radialGradient>
    <filter id="deboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1F1B16" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#FFF0DC" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Crimson Seal Body -->
  <circle cx="60" cy="60" r="54" fill="url(#sealShade)" filter="url(#deboss)" />
  
  <!-- Outer Brass Hairline Ring -->
  <circle cx="60" cy="60" r="49" fill="none" stroke="#C69A45" stroke-width="1.2" stroke-dasharray="3,1.5" opacity="0.9" />
  <!-- Inner Fine Brass Ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#FFF0DC" stroke-width="0.8" opacity="0.6" />

  <!-- Center Canine Silhouette & Heritage Monogram -->
  <g transform="translate(60, 56) scale(0.95)" text-anchor="middle">
    <!-- Stylized Noble Dog Profile -->
    <path d="M-12,-10 C-10,-18 -4,-21 2,-20 C6,-19 9,-16 11,-10 C13,-6 16,-3 20,-2 C22,-1 22,2 19,3 C15,4 12,2 10,6 C8,11 6,15 1,17 C-5,19 -11,15 -14,10 C-17,5 -15,-4 -12,-10 Z" fill="#FFF0DC" opacity="0.95" />
    <circle cx="1" cy="-8" r="1.5" fill="#790B13" />
  </g>

  <!-- Arch Text: GRK KENNEL -->
  <path id="textArcTop" d="M 22 60 A 38 38 0 0 1 98 60" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFF0DC" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      GRK KENNEL
    </textPath>
  </text>

  <!-- Arch Text: VIJAYAWADA -->
  <path id="textArcBottom" d="M 98 60 A 38 38 0 0 1 22 60" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" fill="#E8D5BF" letter-spacing="1.8">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      • VIJAYAWADA •
    </textPath>
  </text>

  <!-- Inner Verification Star -->
  <circle cx="60" cy="85" r="1.8" fill="#C69A45" />
</svg>
